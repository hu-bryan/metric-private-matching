[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-private-matching"
version = "0.1.0"
description = "Reusable metric-private matching mechanisms and reproducible paper experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Hongyi B. Hu"}, {name = "Dung Nguyen"}, {name = "M. Amin Rahimian"}]
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
reproduce = ["pandas>=2.2", "matplotlib>=3.8", "joblib>=1.3", "PyYAML>=6", "pytest>=8", "threadpoolctl>=3"]
dev = ["pytest>=8", "build>=1.2", "setuptools>=77", "wheel"]

[project.urls]
Repository = "https://github.com/hu-bryan/metric-private-matching"

[project.scripts]
metric-private-matching = "metric_private_matching.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["metric_private_matching"]
namespaces = false

[tool.setuptools.package-data]
metric_private_matching = ["reproduction/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo", "**/*.tmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
